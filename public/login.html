<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ActionPulse — Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">

<style>
:root{--bg:#FAFAF7;--surface:#F5F3EE;--surface2:#EDE9E0;--border:rgba(26,24,20,0.08);--border-hover:rgba(26,24,20,0.15);--accent:#C4813A;--accent-dim:#F0E4D0;--red:#A64B42;--red-dim:rgba(166,75,66,0.1);--green:#537853;--green-dim:rgba(83,120,83,0.1);--text:#1A1814;--text-muted:#3D3A34;--text-dim:#7A7570;--radius:5px;--radius-sm:3px}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
body::before{content:'';position:fixed;inset:0;background-image:repeating-linear-gradient(transparent,transparent 27px,var(--border) 28px);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;width:100%;max-width:400px;animation:fadeUp .5s ease both}
.logo-row{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:36px}
.logo-icon{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.logo-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;font-weight:800;letter-spacing:-.4px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border)}
.tab{padding:14px;text-align:center;font-family:'Instrument Serif',serif;font-style:italic;font-size:12px;font-weight:700;color:var(--text-muted);cursor:pointer;transition:color .2s,background .2s;border:none;background:transparent}
.tab.active{color:var(--accent);background:var(--accent-dim)}
.form-body{padding:28px}
label{display:block;font-size:11px;letter-spacing:.06em;color:var(--text-dim);text-transform:uppercase;margin-bottom:6px;margin-top:16px}
label:first-child{margin-top:0}
input[type="email"],input[type="password"],input[type="text"]{width:100%;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'DM Mono',monospace;font-size:13px;color:var(--text);outline:none;transition:border-color .2s}
input:focus{border-color:var(--accent)}
.btn-submit{display:block;width:100%;margin-top:22px;padding:12px;border:none;border-radius:var(--radius-sm);background:var(--accent);color:#fff;font-family:'Instrument Serif',serif;font-style:italic;font-size:14px;font-weight:700;cursor:pointer;transition:opacity .2s}
.btn-submit:hover{opacity:.88}
.btn-submit:disabled{opacity:.4;cursor:not-allowed}
.err-msg{display:none;margin-top:14px;padding:10px 12px;background:var(--red-dim);border:1px solid rgba(166,75,66,.2);border-radius:var(--radius-sm);font-size:12px;color:var(--red);line-height:1.5}
.ok-msg{display:none;margin-top:14px;padding:10px 12px;background:var(--green-dim);border:1px solid rgba(83,120,83,.2);border-radius:var(--radius-sm);font-size:12px;color:var(--green);line-height:1.5}
.back-link{display:block;text-align:center;margin-top:20px;font-size:11px;color:var(--text-dim);text-decoration:none;transition:color .2s}
.back-link:hover{color:var(--text-muted)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0 6px;font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:11px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-family:'DM Mono',monospace;font-size:13px;cursor:pointer;transition:border-color .2s,background .2s}
.btn-google:hover{border-color:var(--border-hover);background:var(--bg)}
.btn-google svg{width:18px;height:18px;flex-shrink:0}
.spinner{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:none;margin:0 auto}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <div class="logo-icon">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h10M3 8h7M3 12h5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="13" cy="11" r="2.5" fill="#fff" opacity=".9"/></svg>
    </div>
    <span class="logo-name">ActionPulse</span>
  </div>

  <div class="card">
    <div class="form-body">
      <form id="authForm" onsubmit="handleAuth(event)">
        <label for="emailInput">Email</label>
        <input type="email" id="emailInput" placeholder="you@company.com" required>
        <button class="btn-submit" type="submit" id="submitBtn">
          <span id="btnText">Continue with Email</span>
          <div class="spinner" id="spinner"></div>
        </button>
      </form>
      <div class="divider">or</div>
      <button class="btn-google" onclick="window.location.href='/api/auth/google'">
        <svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
        Sign in with Google
      </button>
      <div class="err-msg" id="errMsg"></div>
      <div class="ok-msg" id="okMsg"></div>
    </div>
  </div>
  <a class="back-link" href="/">← Back to home</a>
</div>

<script>
// Check if already logged in
fetch('/api/auth/me')
  .then(res => res.json())
  .then(data => {
    if (data.user) window.location.href = '/app.html';
  })
  .catch(() => {});

async function handleAuth(e) {
  e.preventDefault();
  hideMsg();
  const email = document.getElementById('emailInput').value.trim();

  setLoading(true);
  try {
    const res = await fetch('/api/auth/email/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    
    if (!res.ok) {
      const data = await res.json();
      throw new Error(data.error || 'Failed to send login link');
    }
    
    showOk('Check your email for the login link!');
  } catch (err) {
    showErr(err.message || 'Something went wrong');
  } finally {
    setLoading(false);
  }
}

function setLoading(on) {
  document.getElementById('submitBtn').disabled = on;
  document.getElementById('spinner').style.display = on ? 'inline-block' : 'none';
  document.getElementById('btnText').style.display = on ? 'none' : 'inline';
}
function showErr(m) { const el = document.getElementById('errMsg'); el.textContent = m; el.style.display = 'block'; }
function showOk(m)  { const el = document.getElementById('okMsg');  el.textContent = m; el.style.display = 'block'; }
function hideMsg()   { document.getElementById('errMsg').style.display = 'none'; document.getElementById('okMsg').style.display = 'none'; }
</script>
</body>
</html>
